<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="title description">
  <title id="title">质量门槛与 Pareto 候选剪枝示意</title>
  <desc id="description">横轴为估算成本，越左越低；纵轴为质量，越上越高。低于工作包质量门槛的模型先排除，再排除更贵且质量更低的被支配模型。剩余候选继续参加多维评分和组合搜索。所有点均为示意，并非真实模型价格或评测数据。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f0f8f5"/>
    </linearGradient>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#526780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #20344e; }
      .title { font-size: 32px; font-weight: 730; }
      .subtitle { font-size: 18px; fill: #5c7088; }
      .axis { font-size: 19px; fill: #526780; }
      .label { font-size: 19px; font-weight: 700; }
      .caption { font-size: 17px; fill: #5b7189; }
      .step { font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1240" height="660" rx="24" fill="url(#background)"/>
  <text x="43" y="60" class="title">先保证质量，再筛掉明显不划算的候选</text>
  <text x="43" y="94" class="subtitle">示意图：点位仅用于解释算法，不代表真实模型价格或评测结果</text>

  <rect x="109" y="119" width="758" height="410" rx="15" fill="#fff" stroke="#d9e4ef" stroke-width="2"/>
  <path d="M143 494 H835" fill="none" stroke="#617791" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <path d="M143 494 V147" fill="none" stroke="#617791" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <text x="454" y="525" class="axis">估算成本 → 越右越高</text>
  <text x="169" y="158" class="axis">质量 ↑</text>

  <path d="M143 370 H833" fill="none" stroke="#df9c41" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="605" y="343" width="209" height="27" rx="6" fill="#fff6e8"/>
  <text x="613" y="363" class="caption" fill="#a76b20">工作包质量门槛</text>

  <path d="M321 320 L512 255 L752 189" fill="none" stroke="#258e77" stroke-width="4" stroke-dasharray="8 7"/>
  <circle cx="189" cy="436" r="12" fill="#9daabd"/>
  <text x="205" y="430" class="label">A</text>
  <text x="205" y="454" class="caption">低于门槛</text>

  <circle cx="321" cy="320" r="13" fill="#239477" stroke="#fff" stroke-width="3"/>
  <text x="337" y="312" class="label">B</text>
  <text x="337" y="338" class="caption">低价可用</text>

  <circle cx="512" cy="255" r="13" fill="#239477" stroke="#fff" stroke-width="3"/>
  <text x="528" y="248" class="label">C</text>
  <text x="528" y="273" class="caption">中价高质</text>

  <circle cx="638" cy="321" r="12" fill="#9daabd"/>
  <text x="655" y="313" class="label">D</text>
  <text x="655" y="338" class="caption">被 C 支配</text>
  <path d="M623 305 Q573 283 535 269" fill="none" stroke="#95a4b8" stroke-width="2" marker-end="url(#axis-arrow)"/>

  <circle cx="752" cy="189" r="13" fill="#239477" stroke="#fff" stroke-width="3"/>
  <text x="770" y="182" class="label">E</text>
  <text x="770" y="208" class="caption">高价高质</text>

  <rect x="901" y="120" width="298" height="409" rx="16" fill="#fff" stroke="#d9e4ef" stroke-width="2"/>
  <text x="928" y="164" class="step">候选集如何缩小</text>
  <circle cx="940" cy="207" r="15" fill="#5477cf"/>
  <text x="940" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="967" y="211" class="label">质量门槛</text>
  <text x="928" y="242" class="caption">A 的质量不足，先排除。</text>

  <circle cx="940" cy="294" r="15" fill="#5477cf"/>
  <text x="940" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="967" y="298" class="label">Pareto 剪枝</text>
  <text x="928" y="329" class="caption">二维示意中，C 更便宜</text>
  <text x="928" y="355" class="caption">且质量更高，D 被支配。</text>

  <circle cx="940" cy="408" r="15" fill="#5477cf"/>
  <text x="940" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="967" y="412" class="label">有界组合搜索</text>
  <text x="928" y="443" class="caption">B、C、E 继续按任务专长、</text>
  <text x="928" y="469" class="caption">推理、延迟、风险与预算分配。</text>

  <text x="44" y="581" class="subtitle">实际剪枝还比较延迟、专长、推理匹配与风险等维度；图中只画了“质量 × 成本”两个维度。</text>
  <text x="44" y="614" class="subtitle">未提供可信单价时，不会把该路线显示为零费用，也不会据此承诺节省金额。</text>
</svg>
