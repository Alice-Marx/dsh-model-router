name: Test, build and verify package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Enable the packageManager-pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install the exact dependency graph
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify the integration scope, task dependencies and evidence
        run: npm run integration:check
      - name: Run the complete test suite
        run: npm test
      - name: Exercise native Windows UTF-8 terminal
        if: runner.os == 'Windows'
        run: node scripts/check-terminal-utf8.mjs
      - name: Test package verification failures
        run: node --test tests/ci-contract.test.mjs
      - name: Verify the committed client before rebuilding
        run: npm run check:client
      - name: Build the actual desktop client
        run: npm run build:client
      - name: Verify the generated client
        run: npm run check:client
      - name: Compile the offline workbench preview
        run: node scripts/workbench-preview.mjs --check
      - name: Pack the release candidate
        run: npm pack --pack-destination dist
      - name: Verify runtime closure and every packaged byte against Git
        run: node scripts/check-package.mjs

  integration-host:
    name: Combined host / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            security: '--security'
          - os: windows-latest
            node: '24'
            security: ''
    steps:
      - name: Checkout integration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout the frozen DS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Alice-Marx/DS-Bot-model-router
          ref: de55888a93983fc51c94f7d22bc94b4f8293205d
          path: tmp/integration/upstream/ds-bot-frozen
          persist-credentials: false
      - name: Setup the target Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable the pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install fixed root and isolated host dependencies
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
          pnpm --dir tests/fixtures/integration-host install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Exercise real combined Sessions with an offline model
        run: node scripts/integration-combined-host.mjs --ds-root tmp/integration/upstream/ds-bot-frozen --host-root tests/fixtures/integration-host --legacy-policy ${{ matrix.security }}
      - name: Pull the immutable Linux boundary fixture
        if: runner.os == 'Linux'
        run: docker pull --platform linux/amd64 node@sha256:4f77a690f2f8946ab16fe1e791a3ac0667ae1c3575c3e4d0d4589e9ed5bfaf3d
      - name: Verify the Linux container boundary with synthetic files
        if: runner.os == 'Linux'
        run: node scripts/integration-linux-isolation.mjs
      - name: Install the isolated native database probe
        run: npm install --prefix tmp/integration/probes/sqlite --ignore-scripts --no-audit --no-fund --strict-peer-deps --registry=https://registry.npmjs.org better-sqlite3@13.0.3
      - name: Verify native load, transactions and interruption recovery
        run: node scripts/integration-sqlite-probe.mjs
