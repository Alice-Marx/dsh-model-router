name: Test, build and verify package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Enable the packageManager-pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install the exact dependency graph
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify the integration scope, task dependencies and evidence
        run: npm run integration:check
      - name: Run the complete test suite
        run: npm test
      - name: Exercise native Windows UTF-8 terminal
        if: runner.os == 'Windows'
        run: node scripts/check-terminal-utf8.mjs
      - name: Test package verification failures
        run: node --test tests/ci-contract.test.mjs
      - name: Verify the committed client before rebuilding
        run: npm run check:client
      - name: Build the actual desktop client
        run: npm run build:client
      - name: Verify the generated client
        run: npm run check:client
      - name: Compile the offline workbench preview
        run: node scripts/workbench-preview.mjs --check
      - name: Pack the release candidate
        run: npm pack --pack-destination dist
      - name: Verify runtime closure and every packaged byte against Git
        run: node scripts/check-package.mjs

  integration-host:
    name: Combined host / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            security: '--security'
          - os: windows-latest
            node: '24'
            security: ''
    steps:
      - name: Checkout integration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout the frozen DS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Alice-Marx/DS-Bot-model-router
          ref: de55888a93983fc51c94f7d22bc94b4f8293205d
          path: tmp/integration/upstream/ds-bot-frozen
          persist-credentials: false
      - name: Setup the target Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable the pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install fixed root and isolated host dependencies
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
          pnpm --dir tests/fixtures/integration-host install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Build the pinned product SQLite addon
        run: pnpm rebuild better-sqlite3
      - name: Exercise real combined Sessions with an offline model
        run: node scripts/integration-combined-host.mjs --ds-root tmp/integration/upstream/ds-bot-frozen --host-root tests/fixtures/integration-host --legacy-policy ${{ matrix.security }}
      - name: Verify strict automatic Bot lifecycle and authenticated Gateway RPC
        run: node scripts/integration-combined-host.mjs --ds-root tmp/integration/upstream/ds-bot-frozen --host-root tests/fixtures/integration-host --lifecycle
      - name: Pull the immutable Linux boundary fixture
        if: runner.os == 'Linux'
        run: docker pull --platform linux/amd64 node@sha256:4f77a690f2f8946ab16fe1e791a3ac0667ae1c3575c3e4d0d4589e9ed5bfaf3d
      - name: Verify the Linux container boundary with synthetic files
        if: runner.os == 'Linux'
        run: node scripts/integration-linux-isolation.mjs
      - name: Install the isolated native database probe
        run: npm install --prefix tmp/integration/probes/sqlite --ignore-scripts --no-audit --no-fund --strict-peer-deps --registry=https://registry.npmjs.org better-sqlite3@13.0.3
      - name: Verify native load, transactions and interruption recovery
        run: node scripts/integration-sqlite-probe.mjs
      - name: Verify durable task ownership, retries and runner fencing
        run: node scripts/integration-task-probe.mjs
      - name: Verify SQLite money authority, concurrent budgets and cutover rollback recovery
        run: node scripts/integration-finance-probe.mjs
      - name: Verify real MR managed execution, cancellation and host interruption
        run: node scripts/integration-combined-host.mjs --ds-root tmp/integration/upstream/ds-bot-frozen --host-root tests/fixtures/integration-host --tasks
      - name: Verify vendored DS Bot product source against frozen bytes
        run: node scripts/integration-product-source.mjs
      - name: Verify the shipped default single-plugin product composition
        run: node scripts/integration-product-default.mjs
      - name: Verify product UI refresh ordering and ambiguous action responses
        run: node --test tests/product-refresh-order.test.mjs
      - name: Verify the native CLI bridge peer and private bootstrap
        run: node scripts/integration-cli-native.mjs
      - name: Verify CLI atomic Windows Job creation and creator death
        if: runner.os == 'Windows'
        run: node --test tests/cli-native-peer-job.native.mjs tests/cli-native-peer-probe.native.mjs
      - name: Verify CLI Task fencing, shared money receipts and recovery without model calls
        run: node scripts/integration-cli-execution.mjs
      - name: Verify the remote computer agent native tool catalog
        run: node scripts/integration-remote-agent.mjs
      - name: Verify kernel-held Agent ownership, stale-PID races and real controller death
        run: node --test tests/remote-agent-instance.native.mjs
      - name: Verify cancellation reports only evidenced process stops
        run: node --test tests/operation-cancel-evidence.native.mjs
      - name: Verify bound stop-proof and persistent retry dispatch fences
        run: node --test tests/task-retry-stop-evidence.native.mjs
      - name: Verify atomic Windows Job creation and actual creator death without a desktop
        run: node --test tests/windows-process-job.native.mjs
      - name: Verify physical workspace identities and durable alias/overlap write admissions
        run: node --test tests/workspace-identity.native.mjs tests/workspace-admission.native.mjs tests/workspace-agent.native.mjs
      - name: Verify actual Linux isolated command operations and Agent process death recovery
        if: runner.os == 'Linux'
        run: node scripts/integration-remote-container.mjs
      - name: Verify anonymous abuse limits, real TLS and mutual TLS without model calls
        run: node --test tests/remote-auth.native.mjs
      - name: Verify helper protocol arbitration, cancellation and private control paths without a desktop
        run: node --test tests/desktop-client.test.mjs tests/desktop-lease.native.mjs tests/remote-private-roots.native.mjs
      - name: Verify preserved runtime configuration and unified automatic search without external requests
        run: node scripts/integration-web-search-config.mjs
      - name: Verify read-only migration planning, bounded inventory and private preview output
        run: node --test tests/profile-migration-plan.test.mjs tests/migration-snapshot.test.mjs tests/migration-preview-cli.test.mjs
      - name: Verify complete private ledger snapshots and lossless Task and receipt exports
        run: node --test tests/migration-ledger-export.test.mjs
      - name: Verify selected data private capture and source preservation
        run: node --test tests/migration-data-archive.test.mjs
      - name: Verify bounded Session decoding, reference and financial migration audit
        run: node --test tests/migration-session-reader.test.mjs tests/migration-financial-audit.test.mjs tests/migration-domain-audit.test.mjs tests/migration-workspace-audit.test.mjs
      - name: Verify recoverable configuration writes, real process exits and startup maintenance gate
        run: node --test tests/migration-configuration-commit.test.mjs
      - name: Verify actual rc.3 startup blocks pending migration and restores original identity after rollback
        run: node scripts/integration-migration-gate.mjs
      - name: Verify migration audit against the isolated rc.3 host without model calls
        run: node scripts/integration-migration-audit.mjs
      - name: Verify saved memory, capability packs and secret scopes without replay or external mounts
        run: node --test tests/migration-supporting-domains.test.mjs
      - name: Verify Host machine pairing, scoped MCP reads and remote ticket revocation
        run: node scripts/integration-remote-machines.mjs
      - name: Verify tracked remote file writes, durable receipt observation and cancellation without replay
        run: node --test tests/remote-write-tasks.native.mjs
      - name: Verify the migrated DS upstream unit and component suite
        run: node scripts/integration-product-upstream-tests.mjs
      - name: Verify the actual migrated product host with an offline model
        run: node scripts/integration-product-host.mjs
